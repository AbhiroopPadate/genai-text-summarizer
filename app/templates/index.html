<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Text Summarizer</h1>
            <p>Paste your text below to get a concise, AI-generated summary.</p>
        </header>

        <main>
            <div class="input-section">
                <textarea id="text-input" placeholder="Enter or paste your text here..." rows="10"></textarea>
                <div class="stats">
                    <span id="char-count">0 characters</span> | <span id="word-count">0 words</span>
                </div>
                <div class="actions">
                    <button id="summarize-btn" class="primary-btn">Summarize</button>
                    <button id="clear-btn" class="secondary-btn">Clear</button>
                </div>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Generating summary...</p>
            </div>

            <div id="error-message" class="error hidden"></div>

            <div id="result-section" class="hidden">
                <h2>Summary</h2>
                <div id="summary-output"></div>
            </div>
        </main>
        
        <footer>
            <p>Simple AI Summarizer Demo</p>
        </footer>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
